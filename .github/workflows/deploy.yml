name: Deploy to Oracle Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: SSH and deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Clone fresh if not a git repo, otherwise pull
            if [ ! -d "/home/ubuntu/findwallet/.git" ]; then
              rm -rf /home/ubuntu/findwallet
              git clone ${{ secrets.REPO_URL }} /home/ubuntu/findwallet
            fi

            cd /home/ubuntu/findwallet
            git pull origin main

            # Write .env from GitHub secret
            printf '%s' '${{ secrets.ENV_FILE }}' > .env

            # Ensure output.txt exists
            touch output.txt

            # Build and restart
            sudo docker compose down || true
            sudo docker compose up -d --build

            echo "==> Deploy done"
            sudo docker compose ps
